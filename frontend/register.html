<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register - AI QA Assistant</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
    <header class="site-header">
        <div class="header-left">
            <nav class="main-navigation" aria-label="Main navigation">

                <a href="/about.html">About</a>
            </nav>
        </div>
        <h1 class="site-title">AI QA Bug Triage</h1>
        <div class="header-right">

            <nav class="main-navigation" aria-label="Account"><a href="/register.html">Register</a><a href="/login.html">Login</a></nav>
            <button id="theme-toggle" type="button" aria-label="Switch theme">☀</button>
        </div>
    </header>

        <main>
            <section>
                <h2>Create Account</h2>

                <p class="page-description">
                    Create your account to get started.
                </p>

                <form id="register-form">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required>

                    <button type="submit">Register</button>
                </form>

                <p id="message"></p>
            </section>
        </main>

        <footer>
            <p>Copyright &copy; 2026 AI QA Assistant</p>
        </footer>

        <script src="js/theme.js"></script>
        <script src="js/api-errors.js"></script>
        <script src="js/register.js"></script>
    </body>
</html>
