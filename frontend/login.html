<!DOCTYPE html>
<html>
    <head>
        <title>Bug Triage - Login</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>AI QA Assistant</h1>
            <p>This app is designed to help QA analysts with their bug reporting process.</p>

            <nav>
                <a href="index.html">Home</a>
                <a href="register.html">Register</a>
                <a href="about.html">About</a>
            </nav>
        </header>

        <main>
            <section>
                <h2>Login</h2>

                <form id="login-form">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button type="submit">Login</button>
                </form>

                <p id="message"></p>
            </section>
        </main>

        <footer>
            <p>Copyright &copy; 2026 AI QA Assistant</p>
        </footer>

        <script src="js/login.js"></script>
    </body>
</html>
