<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bug Triage - Login</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="/assets/favicon.ico" type="image/x-icon" sizes="16x16 32x32 48x48">
    </head>
    <body>
        <header class="site-header">
        <div class="header-left">
            <nav class="main-navigation" aria-label="Main navigation">

                <a href="/about.html">About</a>
            </nav>
        </div>
        <h1 class="site-title" aria-label="AI QA Bug Triage"><span class="wordmark" aria-hidden="true"><span class="wordmark-prefix">AI QA</span> <span class="wordmark-b">B</span><img class="wordmark-beetle" src="assets/beetle-vertical.png" alt="" width="1254" height="1254"><span>ug</span> <span class="wordmark-triage">Triage</span></span></h1>
        <div class="header-right">

            <nav class="main-navigation" aria-label="Account"><a href="/register.html">Register</a><a href="/login.html">Login</a></nav>
            <button id="theme-toggle" type="button" aria-label="Switch theme">☀</button>
        </div>
    </header>

        <main>
            <section>
                <h2>Login</h2>

                <p class="page-description">
                    Log in to access your projects.
                </p>

                <form id="login-form">
                    <label for="email">Email:</label>
                    <input
                        type="email"
                        id="email"
                        class="form-input"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                    <label for="password">Password:</label>
                    <input
                        type="password"
                        id="password"
                        class="form-input"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button type="submit">Login</button>
                </form>

                <p id="message" class="section-message" role="alert" aria-live="polite"></p>
            </section>
        </main>

        <footer>
            <p>Copyright &copy; 2026 AI QA Assistant</p>
        </footer>

        <script src="js/theme.js"></script>
        <script src="js/api-errors.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
