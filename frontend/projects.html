<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bug Triage - Projects</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-left">
                <nav class="main-navigation" aria-label="Main navigation">
                    <a href="/about.html">About</a>
                </nav>
        </div>
        <h1 class="site-title">AI QA Bug Triage</h1>
            <div class="header-right">
                <span id="header-identity" class="header-identity" hidden></span>
                <button id="logout-button" type="button">Logout</button>
                <button id="theme-toggle" type="button" aria-label="Switch theme">☀</button>
        </div>
    </header>

        <main>
            <section>
                <h2>My Projects</h2>

                <div class="project-actions">
                    <button id="show-project-form" type="button">New Project</button>
                </div>

                <p id="message" class="section-message" role="status" aria-live="polite"></p>

                <form id="project-form" hidden>
                    <label for="project-name">Project name:</label>

                    <input
                        type="text"
                        id="project-name"
                        class="form-input"
                        name="project_name"
                        placeholder="Enter project name"
                        required>

                    <div class="form-actions creation-form-actions">
                        <button class="creation-form-action-button" type="submit">Create</button>
                        <button id="cancel-project-form" class="creation-form-action-button secondary-action-button" type="button">Cancel</button>
                    </div>
                </form>

                <div id="projects"></div>
            </section>
        </main>

        <footer>
            <p>Copyright &copy; 2026 AI QA Assistant</p>
        </footer>

        <script src="js/theme.js"></script>
        <script src="js/logout.js"></script>
        <script src="js/api-errors.js"></script>
        <script src="js/projects.js"></script>
    </body>
</html>
