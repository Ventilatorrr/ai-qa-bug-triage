<!DOCTYPE html>
<html>
    <head>
        <title>Bug Triage - Projects</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="site-header">
            <div class="header-left">
                <nav class="main-navigation">
                    <a href="/projects.html">Projects</a>
                </nav>
            </div>

            <h1 class="site-title">AI QA Bug Triage</h1>

            <div class="header-right">
                <button id="logout-button" type="button">Logout</button>
                <button id="theme-toggle" type="button" aria-label="Switch theme">☀</button>
            </div>
        </header>

        <main>
            <section>
                <h2>My Projects</h2>

                <p id="message"></p>

                <div class="project-actions">
                    <button id="show-project-form" type="button">New Project</button>
                </div>

                <form id="project-form" hidden>
                    <label for="project-name">Project name:</label>

                    <input
                        type="text"
                        id="project-name"
                        class="form-input"
                        name="project_name"
                        placeholder="Enter project name"
                        required>

                    <div class="form-actions">
                        <button type="submit">Create</button>
                        <button id="cancel-project-form" type="button">Cancel</button>
                    </div>
                </form>

                <div id="projects"></div>
            </section>
        </main>

        <footer>
            <p><a href="/about.html">About</a></p>
            <p>Copyright &copy; 2026 AI QA Assistant</p>
        </footer>

        <script src="js/theme.js"></script>
        <script src="js/logout.js"></script>
        <script src="js/projects.js"></script>
    </body>
</html>
