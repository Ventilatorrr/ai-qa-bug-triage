<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-left">
            <nav class="main-navigation">
                <a href="/projects.html">Projects</a>
            </nav>
        </div>

        <h1 class="site-title">AI QA Bug Triage</h1>

        <div class="header-right">
            <button id="logout-button" type="button">Logout</button>
            <button id="theme-toggle" type="button" aria-label="Switch theme">☀</button>
        </div>
    </header>

    <main>
        <section>
            <h2 id="project-name"></h2>

            <h3>Project Members</h3>

            <p id="message"></p>

            <div id="members"></div>

            <div id="member-management" hidden>
                <button id="show-member-form" type="button">Add Member</button>

                <form id="member-form" hidden>
                    <label for="member-email">Email:</label>

                    <input
                        type="email"
                        id="member-email"
                        class="form-input"
                        name="member_email"
                        placeholder="Enter member email"
                        autocomplete="email"
                        required>

                    <label for="member-role">Role:</label>

                    <select
                        id="member-role"
                        class="form-input"
                        name="member_role"
                        required>
                        <option value="QA Analyst">QA Analyst</option>
                        <option value="Developer">Developer</option>
                    </select>

                    <div class="form-actions">
                        <button type="submit">Add Member</button>
                        <button id="cancel-member-form" type="button">Cancel</button>
                    </div>
                </form>
            </div>
        </section>

        <section>
            <h3>Bugs</h3>

            <div class="project-actions">
                <button id="show-bug-form" type="button">New Bug</button>
            </div>

            <form id="bug-form" hidden>
                <label for="bug-title">Title:</label>

                <input
                    type="text"
                    id="bug-title"
                    class="form-input"
                    name="bug_title"
                    placeholder="Enter bug title"
                    required>

                <label for="bug-affected-version">Affected Version:</label>

                <input
                    type="text"
                    id="bug-affected-version"
                    class="form-input"
                    name="affected_version"
                    placeholder="e.g. 1.2.0">

                <label for="bug-description">Description:</label>

                <textarea
                    id="bug-description"
                    class="form-input"
                    name="description"
                    placeholder="Describe the bug"></textarea>

                <label for="bug-steps">Steps to Reproduce:</label>

                <textarea
                    id="bug-steps"
                    class="form-input"
                    name="steps_to_reproduce"
                    placeholder="Describe how to reproduce the bug"></textarea>

                <label for="bug-expected">Expected Result:</label>

                <textarea
                    id="bug-expected"
                    class="form-input"
                    name="expected_result"
                    placeholder="What should happen?"></textarea>

                <label for="bug-actual">Actual Result:</label>

                <textarea
                    id="bug-actual"
                    class="form-input"
                    name="actual_result"
                    placeholder="What actually happens?"></textarea>

                <label for="bug-severity">Severity:</label>

                <select
                    id="bug-severity"
                    class="form-input"
                    name="severity">
                    <option value="">Select severity</option>
                    <option value="Blocker">Blocker</option>
                    <option value="Major">Major</option>
                    <option value="Minor">Minor</option>
                </select>

                <label for="bug-priority">Priority:</label>

                <select
                    id="bug-priority"
                    class="form-input"
                    name="priority">
                    <option value="">Select priority</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>

                <label for="bug-assignee">Assignee:</label>

                <select
                    id="bug-assignee"
                    class="form-input"
                    name="assignee_id">
                    <option value="">Unassigned</option>
                </select>

                <label for="bug-fix-version">Fix Version:</label>

                <input
                    type="text"
                    id="bug-fix-version"
                    class="form-input"
                    name="fix_version"
                    placeholder="e.g. 1.3.0">

                <div class="form-actions">
                    <button type="submit">Create Bug</button>
                    <button id="cancel-bug-form" type="button">Cancel</button>
                </div>
            </form>

            <div id="bugs"></div>
        </section>
    </main>

    <footer>
        <p><a href="/about.html">About</a></p>
        <p>Copyright &copy; 2026 AI QA Assistant</p>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/logout.js"></script>
    <script src="js/project.js"></script>
</body>
</html>
